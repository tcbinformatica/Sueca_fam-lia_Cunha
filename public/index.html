<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b4d2f">
<title>TCB Cartas</title>
<link rel="icon" href="/icon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TCB Cartas"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;color:#fff;background:radial-gradient(circle at 50% 40%,#13784a,#0b4d2f 75%);overflow:hidden;user-select:none}
[hidden]{display:none!important}
.screen{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
h1{font-size:40px;margin:5vh 0 4px;text-align:center;letter-spacing:2px}
.sub{text-align:center;opacity:.8;margin-bottom:28px}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.gt{background:rgba(0,0,0,.25);border:2px solid transparent;border-radius:14px;padding:8px 2px 6px;text-align:center;font-size:13px;font-weight:700;position:relative}
.gt svg{width:72px;height:60px;display:block;margin:0 auto 2px}.gt small{display:block;font-weight:400;opacity:.7;font-size:11px}
.gt.sel{border-color:#f4c542;background:rgba(244,197,66,.18)}.gt.soon{opacity:.45}
.gt .tag{position:absolute;top:4px;right:6px;background:#f4c542;color:#222;font-size:10px;padding:1px 5px;border-radius:6px}
#lgame svg{width:72px;height:60px;display:block;margin:4px auto 0}
input{width:100%;padding:14px;font-size:18px;border-radius:12px;border:0;margin:6px 0;color:#111}
button{padding:14px;font-size:17px;font-weight:700;border-radius:12px;border:0;background:#f4c542;color:#222;width:100%;margin:6px 0}
button.ghost{background:rgba(255,255,255,.15);color:#fff}
button.sm{width:auto;padding:8px 12px;font-size:14px;margin:4px 0 0}
.or{text-align:center;opacity:.6;margin:14px 0 6px}
.row{display:flex;gap:8px}
#lcode{font-size:48px;font-weight:800;letter-spacing:8px;text-align:center;margin:20px 0 4px}
.seat{background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;flex-direction:column}
.seat.t0{border-left:5px solid #f4c542}.seat.t1{border-left:5px solid #6ec6ff}
.seat small{opacity:.7}.seat span{font-size:18px;margin:2px 0}
.seat .btns{display:flex;gap:8px}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;font-size:15px}
#score b{font-size:20px}
.cz{display:flex;align-items:center;gap:6px}
#trump{display:flex;align-items:center;gap:6px;font-size:13px}
#trump small{opacity:.7}
#table{flex:1;position:relative}
.pl{position:absolute;text-align:center;font-size:14px;padding:4px 10px;border-radius:10px;background:rgba(0,0,0,.25);max-width:30vw}
.pl small{display:block;opacity:.7;font-size:11px}
.pl.mate{border:1px solid #f4c542}
.pl.turn{background:#f4c542;color:#222}
.pl.top{top:6px;left:50%;transform:translateX(-50%)}
.pl.left{left:0;top:17%}.pl.right{right:0;top:17%}.pl.bottom{display:none}.pl.bottom.show{display:block;bottom:96px;left:50%;transform:translateX(-50%)}
#tpts{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);background:#f4c542;color:#222;font-weight:800;font-size:18px;padding:6px 14px;border-radius:20px;z-index:4;pointer-events:none}
#logo{position:absolute;left:50%;top:56%;width:min(250px,64vw);transform:translate(-50%,-50%);opacity:.22;pointer-events:none}
#trick{position:absolute;left:50%;top:56%;width:min(250px,64vw);height:min(280px,50%);transform:translate(-50%,-50%)}
#trick[class*=go]{transition:transform 1.1s ease-in,opacity 1.1s ease-in;opacity:0}
#trick.go-top{transform:translate(-50%,-160%) scale(.4)}#trick.go-bottom{transform:translate(-50%,70%) scale(.4)}
#trick.go-left{transform:translate(-150%,-50%) scale(.4)}#trick.go-right{transform:translate(50%,-50%) scale(.4)}
.card.win{box-shadow:0 0 0 3px #f4c542,0 0 18px #f4c542}
.tk{position:absolute}
.tk.bottom{bottom:0;left:50%;transform:translateX(-50%)}
.tk.top{top:0;left:50%;transform:translateX(-50%)}
.tk.left{left:0;top:50%;transform:translateY(-50%)}
.tk.right{right:0;top:50%;transform:translateY(-50%)}
#status{text-align:center;height:22px;font-weight:700}
#hand{display:flex;justify-content:center;padding:14px 0 10px;min-height:124px}
#hand .card{flex-shrink:0;transition:transform .15s}
.card{width:66px;height:96px;background:#fff;color:#111;border-radius:8px;display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:7px 8px;font-weight:800;font-size:24px;box-shadow:0 2px 6px rgba(0,0,0,.45);line-height:1}
.card i{font-style:normal;font-size:30px;margin-top:2px}
.card.red{color:#c62828}
.card.mini{width:30px;height:44px;font-size:12px;padding:0;align-items:center;justify-content:center}.card.mini i{font-size:15px;margin:0}
.card.ok{transform:translateY(-10px);box-shadow:0 0 0 2px #f4c542,0 4px 8px rgba(0,0,0,.5)}
.card.no{filter:brightness(.55)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px}
#ov>div{background:#0b4d2f;border:2px solid #f4c542;border-radius:16px;padding:20px;text-align:center;width:100%;max-width:340px}
#ovt{font-size:22px;font-weight:800}#ovp{margin:10px 0 16px;opacity:.9}
#acc{position:absolute;right:0;bottom:4px;width:auto;padding:8px 12px;font-size:14px;background:#d84343;color:#fff;margin:0}
.vid{position:absolute;width:78px;height:78px;border-radius:50%;object-fit:cover;background:#000;border:2px solid rgba(255,255,255,.5);z-index:2}
.vid:not(.on){display:none}
#v-top{top:54px;left:50%;margin-left:-39px}#v-left{left:4px;top:calc(17% + 54px)}#v-right{right:4px;top:calc(17% + 54px)}#v-bottom{right:4px;bottom:52px;transform:scaleX(-1)}
#top .tb{display:flex;gap:6px}
#toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:#222;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#gbox{position:absolute;bottom:4px;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:3}
#gbox div{font-size:13px;opacity:.85}#gbox b{font-size:20px;letter-spacing:3px;display:block}
.gr{display:flex;gap:6px}.gr button{width:auto;margin:0;padding:6px 10px;font-size:14px}
#tbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}#tbar:empty{display:none}
#tbar button{width:auto;padding:10px 16px;margin:4px 0}#tbar .red{background:#d84343;color:#fff}#tbar .card{width:44px;height:64px;font-size:16px;padding:4px 5px}#tbar .card i{font-size:20px}
.card.back{background:repeating-linear-gradient(45deg,#b3262c 0 6px,#8e1d22 6px 12px);border:3px solid #fff}
.pile{position:absolute;top:50%;transform:translateY(-50%);text-align:center;font-size:13px}.pile small{display:block;margin-top:6px;opacity:.85}
.pst{left:6%}.pds{right:6%}.pile .card.ok{transform:none}
.melds{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}.mg{display:flex;gap:2px}
#toast{z-index:9;max-width:90vw;text-align:center}
/* ---------- Tela larga (computador / tablet deitado) ---------- */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  #home,#lobby{max-width:460px;margin:0 auto}
  #game{max-width:1200px;margin:0 auto;padding:0 24px}
  #top{padding:12px 0;font-size:17px}
  .card{width:86px;height:124px;font-size:30px;padding:9px 10px}.card i{font-size:40px}
  .card.mini{width:40px;height:58px;font-size:15px}.card.mini i{font-size:20px}
  #trick,#logo{width:330px;top:48%}#trick{height:min(360px,62%)}
  #hand{min-height:150px}
  .pl{font-size:17px;max-width:220px}.pl.left{left:2%;top:40%}.pl.right{right:2%;top:40%}
  .pl.left,.pl.right{transform:translateY(-50%)}
  .vid{width:120px;height:120px}
  #v-top{top:60px;margin-left:-60px}#v-left{left:2%;top:calc(40% + 40px)}#v-right{right:2%;top:calc(40% + 40px)}#v-bottom{bottom:60px}
  #tbar button{padding:12px 22px;font-size:18px}
}
</style>
</head>
<body>

<div id="home" class="screen">
  <h1>♠ TCB Cartas ♥</h1>
  <div class="sub">Família Cunha</div>
  <input id="name" placeholder="Seu nome" maxlength="14">
  <div id="gsel" class="games"></div>
  <button id="create">Criar sala</button>
  <div class="or">ou entre com o código</div>
  <div class="row"><input id="code" placeholder="CÓDIGO" maxlength="4" style="text-transform:uppercase"><button id="join" style="width:40%">Entrar</button></div>
  <button id="watch" class="ghost">👀 Só assistir</button>
</div>

<div id="lobby" class="screen" hidden>
  <div class="sub" style="margin:16px 0 0">Código da sala</div>
  <div id="lcode"></div>
  <div id="lgame" class="sub" style="margin:0;font-weight:700;opacity:1"></div>
  <button id="share" class="ghost">Compartilhar código</button>
  <div id="lduo" class="sub" style="margin:10px 0 0">Duplas: lugares 1 e 3 contra 2 e 4</div>
  <div id="seats"></div>
  <div id="lspec" class="sub" style="margin:6px 0 0"></div>
  <div style="flex:1"></div>
  <button id="start">Começar (vagas viram bots)</button>
  <div id="wait" class="sub">Aguardando o anfitrião começar…</div>
  <button id="leave1" class="ghost">Sair da sala</button>
</div>

<div id="game" class="screen" hidden>
  <div id="top"><div id="score"></div><div id="trump"></div><div class="tb"><button id="leave2" class="ghost sm">Sair</button></div></div>
  <div id="table">
    <div id="p-top" class="pl"></div><div id="p-left" class="pl"></div><div id="p-right" class="pl"></div><div id="p-bottom" class="pl"></div>
    <svg id="logo" viewBox="0 0 200 200" aria-hidden="true">
      <defs><path id="arcT" d="M30,100 a70,70 0 1,1 140,0"/><path id="arcB" d="M38,100 a62,62 0 0,0 124,0"/></defs>
      <circle cx="100" cy="100" r="92" fill="none" stroke="#f4c542" stroke-width="3"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#f4c542" stroke-width="1.5"/>
      <text font-family="Georgia,serif" font-size="17" font-weight="700" fill="#f4c542" letter-spacing="6"><textPath href="#arcT" startOffset="50%" text-anchor="middle">FAMÍLIA</textPath></text>
      <text font-family="Georgia,serif" font-size="13" fill="#f4c542" letter-spacing="4"><textPath href="#arcB" startOffset="50%" text-anchor="middle">♠ ♥ TCB ♦ ♣</textPath></text>
      <text x="100" y="114" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">Cunha</text>
    </svg>
    <div id="trick"></div>
    <div id="tpts" hidden></div>
    <video id="v-top" class="vid" autoplay playsinline></video><video id="v-left" class="vid" autoplay playsinline></video>
    <video id="v-right" class="vid" autoplay playsinline></video><video id="v-bottom" class="vid" autoplay playsinline muted></video>
    <div id="gbox"><div>Sala<b id="gnum"></b></div><div class="gr"><button id="gcode" class="ghost">📤 Enviar link</button><button id="cam" class="ghost">📷</button><button id="mic" class="ghost" hidden>🎤</button><button id="sitbot" hidden>🪑 Jogar</button></div></div>
    <button id="acc" hidden>🚨 Renúncia!</button>
  </div>
  <div id="status"></div>
  <div id="tbar"></div>
  <div id="hand"></div>
</div>

<div id="ov" hidden><div><div id="ovt"></div><div id="ovp"></div><button id="acc2" class="ghost" hidden>🚨 Acusar renúncia</button><button id="next"></button></div></div>
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const SY={h:'♥',d:'♦',s:'♠',c:'♣'}, POS=['bottom','right','top','left'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pid; try{pid=localStorage.pid||(localStorage.pid=Math.random().toString(36).slice(2)+Date.now().toString(36))}catch(e){pid=Math.random().toString(36).slice(2)}
try{$('name').value=localStorage.name||''}catch(e){}
{const c=new URLSearchParams(location.search).get('sala');if(c)$('code').value=c.toUpperCase().slice(0,4)} // link de convite já preenche o código
const sock=io(); let st=null;
sock.on('connect',()=>sock.emit('hello',{pid}));
sock.on('state',s=>{st=s;if(s&&s.msg&&s.msg.id!==lastMsg){if(lastMsg!==null||Date.now()-s.msg.id<5000)toast(s.msg.text);lastMsg=s.msg.id}render();rtcSync()});
sock.on('err',toast);

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),3500)}
function nm(){const n=$('name').value.trim();if(!n){toast('Digite seu nome');return null}try{localStorage.name=n}catch(e){}return n}
function show(id){for(const x of['home','lobby','game'])$(x).hidden=x!==id}
function card(c,cls=''){return `<div class="card ${'hd'.includes(c[1])?'red':''} ${cls}" data-c="${c}"><b>${c[0]==='T'?'10':c[0]}</b><i>${SY[c[1]]}</i></div>`}

// ---------- Escolha do jogo, com um desenho para cada ----------
function mc(x,y,rot,r,su,back){ // carta pequena desenhada em SVG
  const red='hd'.includes(su),S={h:'♥',d:'♦',s:'♠',c:'♣'}[su];
  return `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="-13" y="-19" width="26" height="38" rx="3.5" fill="${back?'#b3262c':'#fff'}" stroke="#222" stroke-width=".8"/>`+
    (back?`<rect x="-10" y="-16" width="20" height="32" rx="2" fill="none" stroke="#f4c542" stroke-width="1"/><path d="M-10 -16 L10 16 M10 -16 L-10 16" stroke="#f4c542" stroke-width=".6"/>`
    :`<text x="-10" y="-9" font-size="9" font-weight="700" fill="${red?'#c62828':'#111'}" font-family="Arial">${r}</text><text x="0" y="11" font-size="17" text-anchor="middle" fill="${red?'#c62828':'#111'}">${S}</text>`)+`</g>`}
const ICON={
  sueca:`<svg viewBox="0 0 80 64">${mc(30,34,-14,'A','s')}${mc(50,34,14,'7','h')}</svg>`,
  truco_p:`<svg viewBox="0 0 80 64">${mc(24,38,-20,'3','d')}${mc(40,32,0,'2','s')}${mc(56,38,20,'4','c')}</svg>`,
  truco_m:`<svg viewBox="0 0 80 64">${mc(24,38,-20,'A','s')}${mc(40,32,0,'7','h')}${mc(56,38,20,'4','c')}</svg>`,
  buraco:`<svg viewBox="0 0 80 64">${mc(19,34,0,'4','h')}${mc(33,34,0,'5','h')}${mc(47,34,0,'6','h')}${mc(61,34,0,'7','h')}</svg>`,
  pife:`<svg viewBox="0 0 80 64">${mc(26,36,-10,'K','c')}${mc(40,32,0,'K','d')}${mc(54,36,10,'K','s')}</svg>`,
  burro:`<svg viewBox="0 0 80 64"><path d="M27 20 L22 2 L33 15 Z M53 20 L58 2 L47 15 Z" fill="#8d8d8d" stroke="#222" stroke-width=".8"/>${mc(40,40,0,'','s',1)}<circle cx="34" cy="36" r="2" fill="#fff"/><circle cx="46" cy="36" r="2" fill="#fff"/></svg>`,
};
const GLIST=[['sueca','Sueca','4 jogadores'],['truco_p','Truco','Paulista','SP'],['truco_m','Truco','Mineiro','MG'],
  ['buraco','Buraco','em breve',0,1],['pife','Pife','2 a 4'],['burro','Burro','2 a 4']];
const GNAME={sueca:'Sueca',truco_p:'Truco Paulista',truco_m:'Truco Mineiro',pife:'Pife',burro:'Burro'};
const FLEX={pife:1,burro:1};let byVal=false;
let selGame='sueca';try{if(GNAME[localStorage.game])selGame=localStorage.game}catch(e){}
function drawGames(){$('gsel').innerHTML=GLIST.map(([id,n,sub,tag,soon])=>`<div class="gt${id===selGame?' sel':''}${soon?' soon':''}" data-g="${soon?'':id}">${tag?`<span class="tag">${tag}</span>`:''}${ICON[id]}${n}<small>${sub}</small></div>`).join('')}
drawGames();
$('gsel').onclick=e=>{const t=e.target.closest('[data-g]');if(!t)return;if(!t.dataset.g)return toast('Esse jogo chega em breve!');selGame=t.dataset.g;try{localStorage.game=selGame}catch(e){}drawGames()};
$('create').onclick=()=>{const n=nm();n&&sock.emit('create',{name:n,game:selGame})};
$('join').onclick=()=>{const n=nm();n&&sock.emit('join',{name:n,code:$('code').value})};
$('watch').onclick=()=>{const n=nm();n&&sock.emit('join',{name:n,code:$('code').value,watch:true})};
$('sitbot').onclick=()=>{const i=st.seats.findIndex(s=>s&&s.bot);if(i>=0)sock.emit('sit',{seat:i})};
$('start').onclick=()=>sock.emit('start');
$('next').onclick=()=>sock.emit('next');
$('acc').onclick=$('acc2').onclick=()=>{if(confirm('Acusar a outra dupla de renúncia?\nSe errar, eles ganham 1 jogo.'))sock.emit('accuse')};
let lastMsg=null;
$('leave1').onclick=$('leave2').onclick=()=>{if(confirm('Sair da sala?'))sock.emit('leave')};
$('share').onclick=$('gcode').onclick=()=>{const t=`Bora jogar Sueca! Código da sala: ${st.code}\n${location.origin}/?sala=${st.code}`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});else navigator.clipboard.writeText(t).then(()=>toast('Código copiado'))};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sit],[data-bot],[data-a],[data-local],#hand .card');if(!t)return;
  if(t.dataset.local){byVal=!byVal;return render()}
  if(t.dataset.a){const [type,ans]=t.dataset.a.split(':');return sock.emit('act',{type,ans})}
  if(!t.dataset.sit&&!t.dataset.bot&&st.game!=='sueca'){if(st.canPlay)sock.emit('play',{card:t.dataset.c});return}
  if(t.dataset.sit)sock.emit('sit',{seat:+t.dataset.sit});
  else if(t.dataset.bot)sock.emit('bot',{seat:+t.dataset.bot});
  else if(st.legal.includes(t.dataset.c)){
    const c=t.dataset.c,lead=st.trick.length&&!st.win&&st.trick[0].card[1]; // aviso só para quem joga
    if(lead&&c[1]!==lead&&st.hand.some(x=>x[1]===lead)&&!confirm(`⚠️ Você tem ${SY[lead]}!\nJogar ${c[0]}${SY[c[1]]} é renúncia e pode ser acusada.\n\nJogar mesmo assim?`))return;
    sock.emit('play',{card:c})}
});

// ---------- Câmera e áudio (WebRTC, direto entre os celulares) ----------
// Jogadores: câmera + microfone. Espectadores: só microfone, e veem a câmera dos jogadores.
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
const pcs={};let local=null,online={},myId=null;
const base=()=>st.me>=0?st.me:0, isSpec=()=>st&&st.me<0;
function mediaEl(j){
  if(j[0]==='p')return $('v-'+POS[(+j.slice(1)-base()+4)%4]);
  let a=document.getElementById('a-'+j);if(!a){a=document.createElement('audio');a.id='a-'+j;a.autoplay=true;document.body.appendChild(a)}return a}
function closePc(j){if(pcs[j]){pcs[j].close();delete pcs[j]}if(!st||st.phase==='lobby')return;const el=mediaEl(j);
  if(el.tagName==='AUDIO')el.remove();else if(!(j===myId)){el.srcObject=null;el.classList.remove('on')}}
function newPc(j){closePc(j);const pc=pcs[j]=new RTCPeerConnection(ICE);
  pc.onicecandidate=e=>e.candidate&&sock.emit('rtc',{to:j,type:'ice',c:e.candidate});
  pc.ontrack=e=>{const el=mediaEl(j);el.srcObject=e.streams[0];if(e.track.kind==='video'&&el.tagName==='VIDEO')el.classList.add('on');el.play().catch(()=>{})};
  return pc}
function addLocal(pc){if(local)local.getTracks().forEach(t=>pc.addTrack(t,local))}
async function offer(j){const pc=newPc(j);addLocal(pc);
  for(const k of['video','audio'])if(!local||!local.getTracks().some(t=>t.kind===k))pc.addTransceiver(k,{direction:'recvonly'});
  await pc.setLocalDescription(await pc.createOffer());sock.emit('rtc',{to:j,type:'offer',sdp:pc.localDescription})}
sock.on('rtc',async m=>{try{
  if(!m.from)return;
  if(m.type==='want')return offer(m.from);
  if(m.type==='offer'){const pc=newPc(m.from);await pc.setRemoteDescription(m.sdp);addLocal(pc);
    await pc.setLocalDescription(await pc.createAnswer());sock.emit('rtc',{to:m.from,type:'answer',sdp:pc.localDescription})}
  else if(m.type==='answer')await pcs[m.from]?.setRemoteDescription(m.sdp);
  else if(m.type==='ice')await pcs[m.from]?.addIceCandidate(m.c);
}catch(e){console.log(e)}});
function connect(j){if(myId<j)offer(j);else sock.emit('rtc',{to:j,type:'want'})}
function peers(){const L=[];st.seats.forEach((s,j)=>{if(s&&!s.bot&&s.online&&'p'+j!==myId)L.push('p'+j)});
  st.specs.forEach(x=>{if(x.online&&x.id!==myId)L.push(x.id)});return L}
function stopLocal(){if(local){local.getTracks().forEach(t=>t.stop());local=null}$('v-bottom').classList.remove('on');camLabels()}
function camLabels(){const sp=isSpec();$('mic').hidden=!local||sp;
  $('cam').textContent=sp?(local?'🔇 Calar':'🎤 Falar'):(local?'🚫📷':'📷')}
function rtcSync(){ // liga com quem entrou, desliga de quem saiu
  if(!st||st.phase==='lobby'){for(const j in pcs)closePc(j);online={};if(local)stopLocal();myId=null;return}
  if(myId!==st.myId){for(const j in pcs)closePc(j);online={};if(local)stopLocal();myId=st.myId} // virou jogador/espectador
  $('v-bottom').muted=!isSpec();camLabels();
  const L=peers();for(const j in pcs)if(!L.includes(j))closePc(j);
  for(const j of L)if(!online[j]&&!pcs[j])connect(j);
  online=Object.fromEntries(L.map(j=>[j,1]));
}
$('cam').onclick=async()=>{
  const sp=isSpec();
  if(local)stopLocal();
  else{try{local=await navigator.mediaDevices.getUserMedia(sp?{audio:{echoCancellation:true,noiseSuppression:true}}:
      {video:{facingMode:'user',width:240,height:240},audio:{echoCancellation:true,noiseSuppression:true}})}
    catch(e){return toast(sp?'Sem permissão para o microfone':'Sem permissão para câmera/microfone')}
    if(!sp){$('v-bottom').srcObject=local;$('v-bottom').classList.add('on')}
    $('mic').textContent='🎤';camLabels()}
  for(const j of peers())connect(j); // renegocia com todos
};
$('mic').onclick=()=>{const a=local&&local.getAudioTracks()[0];if(!a)return;a.enabled=!a.enabled;$('mic').textContent=a.enabled?'🎤':'🔇'};

function cruz(n){ // placar em cruz: uma bolinha em cada canto por ponto
  const q=[[8,8],[24,8],[24,24],[8,24]];
  return `<svg width="34" height="34" viewBox="0 0 32 32"><path d="M16 2V30M2 16H30" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>`+
    q.slice(0,Math.min(n,4)).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4.5" fill="#f4c542"/>`).join('')+`</svg>`}
function render(){
  if(!st)return show('home');
  if(st.phase==='lobby')return renderLobby();
  show('game');for(const p of POS)$('p-'+p).style.display='';
  if(st.game==='pife')return renderPife();if(st.game==='burro')return renderBurro();if(st.game!=='sueca')return renderTruco();$('tbar').innerHTML='';renderGame();
}
function renderLobby(){
  show('lobby');$('lcode').textContent=st.code;$('lgame').innerHTML=(ICON[st.game]||'')+(GNAME[st.game]||'');$('lduo').textContent=FLEX[st.game]?'Cada um por si · de 2 a 4 jogadores':'Duplas: lugares 1 e 3 contra 2 e 4';
  $('start').textContent=FLEX[st.game]?'Começar':'Começar (vagas viram bots)';$('ov').hidden=true;
  $('seats').innerHTML=st.seats.map((s,i)=>`<div class="seat t${i%2}">
    <small>${i%2?'Dupla B':'Dupla A'} · lugar ${i+1}</small>
    <span>${s?(s.bot?'🤖 ':'')+esc(s.name)+(i===st.me?' (você)':''):'— vazio —'}</span>
    <div class="btns">${!s?`<button class="ghost sm" data-sit="${i}">Sentar aqui</button>`:''}
    ${st.host&&(!s||s.bot)?`<button class="ghost sm" data-bot="${i}">${s?'Tirar bot':'+ Bot'}</button>`:''}</div></div>`).join('');
  $('lspec').textContent=st.specs.length?'👀 Assistindo: '+st.specs.map(x=>x.name).join(', '):'';
  $('start').hidden=!st.host;$('wait').hidden=st.host;
}
// ---------- Pife e Burro (cada um por si, 2 a 4) ----------
function soloBase(){
  const sp=st.me<0,me=sp?Math.max(0,st.seats.findIndex(Boolean)):st.me,nm=i=>esc(st.seats[i].name);
  $('gnum').textContent=st.code+(st.specs.length?` · 👀${st.specs.length}`:'');
  $('sitbot').hidden=!(sp&&st.seats.some(s=>s&&s.bot));$('acc').hidden=$('acc2').hidden=true;
  for(let i=0;i<4;i++){
    const rel=(i-me+4)%4,el=$('p-'+POS[rel]),s=st.seats[i];
    if(!s){el.style.display='none';continue}
    const done=st.out&&st.out.includes(i);
    el.className='pl '+POS[rel]+(sp&&!rel?' show':'')+(st.turn===i&&st.phase==='play'?' turn':'');
    el.innerHTML=`${s.bot?'🤖 ':''}${esc(s.name)}${s.online?'':' 💤'}<small>${done?'✓ saiu':st.counts[i]+' cartas'}</small>`;
  }
  return {sp,me,nm};
}
function handUI(cls){
  const h=byVal?[...st.hand].sort((a,b)=>'A23456789TJQK'.indexOf(a[0])-'A23456789TJQK'.indexOf(b[0])):st.hand;
  $('hand').innerHTML=h.map(c=>card(c,cls(c))).join('');
  const cs=[...$('hand').children],n=cs.length,av=$('hand').clientWidth-8,W=cs.length?cs[0].offsetWidth:66,ml=n>1?Math.min(6,(av-n*W)/(n-1)):0;cs.forEach((c,i)=>c.style.marginLeft=i?ml+'px':'0');
}
const sortBtn=()=>`<button class="ghost" data-local="sort">↕ ${byVal?'Por naipe':'Por número'}</button>`;
function renderPife(){
  const {sp,me,nm}=soloBase();
  $('score').innerHTML=`<div style="font-weight:700">Pife</div><small style="opacity:.8">Vitórias: ${st.seats.map((s,i)=>s?`${esc(s.name)} ${st.wins[i]}`:'').filter(Boolean).join(' · ')}</small>`;
  $('trump').innerHTML='';
  const tr=$('trick');tr.className='';$('tpts').hidden=true;
  const dc=(c,a)=>card(c,st.canDraw?'ok':'').replace('<div class="','<div data-a="'+a+'" class="');
  tr.innerHTML=`<div class="pile pst"><div class="card back${st.canDraw?' ok':''}" data-a="draw:stock"></div><small>Monte (${st.stock})</small></div>`+
    `<div class="pile pds">${st.top?dc(st.top,'draw:discard'):'<div class="card" style="opacity:.2"></div>'}<small>Lixo</small></div>`;
  handUI(()=>st.canPlay?'ok':'');
  $('status').textContent=sp?'👀 Você está assistindo':st.phase!=='play'?'':st.canDraw?'Sua vez: compre do monte ou pegue do lixo':st.canPlay?'Agora descarte uma carta':`Vez de ${st.seats[st.turn].name}`;
  $('tbar').innerHTML=(st.canBeat?'<button class="red" data-a="beat">🏆 Bater!</button>':'')+(sp?'':sortBtn());
  const r=st.result,over=st.phase==='handEnd';$('ov').hidden=!over;
  if(over&&r){$('ovt').textContent=r.seat===st.me?'🏆 Você bateu!':`🏆 ${st.seats[r.seat].name} bateu!`;
    $('ovp').innerHTML=`<div class="melds">${r.melds.map(g=>'<div class="mg">'+g.map(c=>card(c,'mini')).join('')+'</div>').join('')}</div><small>Descartou ${card(r.discard,'mini')}</small>`;
    $('next').textContent='Próxima rodada'}
}
function renderBurro(){
  const {sp,me,nm}=soloBase();
  $('score').innerHTML=`<div style="font-weight:700">Burro 🫏</div><small style="opacity:.8">Burros: ${st.seats.map((s,i)=>s?`${esc(s.name)} ${st.burros[i]}`:'').filter(Boolean).join(' · ')}</small>`;
  $('trump').innerHTML=`<div><small>Monte<br><b style="font-size:16px">${st.stock}</b></small></div>`;
  const tr=$('trick');tr.className='';clearTimeout(tr.h);
  tr.innerHTML=st.trick.map(t=>card(t.card,'tk '+POS[(t.seat-me+4)%4]+(t.seat===st.win?' win':''))).join('');
  const tp=$('tpts');tp.hidden=st.win==null;if(st.win!=null){tp.textContent=`Leva: ${st.seats[st.win].name}`;tr.h=setTimeout(()=>tr.className='go-'+POS[(st.win-me+4)%4],1300)}
  const lead=st.trick.length?st.trick[0].card[1]:null;
  handUI(c=>st.canPlay?(st.legal.includes(c)?'ok':'no'):'');
  $('status').textContent=sp?'👀 Você está assistindo':st.phase!=='play'?'':st.mustDraw?`Você não tem ${SY[lead]}: compre do monte`:st.canPlay?(lead?`Sua vez! Siga ${SY[lead]}`:'Sua vez! Jogue qualquer carta'):st.hand.length||st.me<0?`Vez de ${st.seats[st.turn].name}`:'✓ Você saiu! Aguarde o fim';
  $('tbar').innerHTML=(st.mustDraw?'<button class="red" data-a="draw">🂠 Comprar do monte</button>':'')+(sp||!st.hand.length?'':sortBtn());
  const r=st.result,over=st.phase==='handEnd';$('ov').hidden=!over;
  if(over&&r){$('ovt').textContent=r.burro===st.me?'🫏 Você é o burro!':`🫏 ${st.seats[r.burro].name} é o burro!`;
    $('ovp').textContent=r.out.length?'Saíram: '+r.out.map((i,k)=>`${k+1}º ${st.seats[i].name}`).join(', '):'';
    $('next').textContent='Próxima rodada'}
}
function renderTruco(){
  const sp=st.me<0,me=sp?0:st.me,my=me%2,NOS=sp?'Dupla A':'Nós',ELES=sp?'Dupla B':'Eles',TEAM=k=>k===my?NOS:ELES;
  const O='4567QJKA23',nm=i=>esc(st.seats[i].name);
  $('gnum').textContent=st.code+(st.specs.length?` · 👀${st.specs.length}`:'');
  $('sitbot').hidden=!(sp&&st.seats.some(s=>s&&s.bot));$('acc').hidden=$('acc2').hidden=true;
  $('score').innerHTML=`<div class="cz">${NOS} <b>${st.score[my]}</b> × <b>${st.score[1-my]}</b> ${ELES}</div><small style="display:block;opacity:.75">${st.variant==='mineiro'?'Mineiro':'Paulista'} · até 12 · Partidas ${st.matches[my]} × ${st.matches[1-my]}</small>`;
  $('trump').innerHTML=st.vira?`<div><small>Vira · manilha<br><b style="font-size:16px">${O[(O.indexOf(st.vira[0])+1)%10]}</b></small></div>`+card(st.vira,'mini')
    :`<div><small>Manilhas<br>4♣ 7♥ A♠ 7♦</small></div>`;
  for(let i=0;i<4;i++){
    const rel=(i-me+4)%4,el=$('p-'+POS[rel]),s=st.seats[i];
    el.className='pl '+POS[rel]+(sp&&!rel?' show':'')+(st.turn===i&&st.phase==='play'&&!st.pending?' turn':'')+(i%2===my&&rel?' mate':'');
    el.innerHTML=`${s.bot?'🤖 ':''}${esc(s.name)}${s.online?'':' 💤'}<small>${st.counts[i]} cartas${!sp&&i%2===my?' · parceiro':''}</small>`;
  }
  const tr=$('trick');tr.className='';clearTimeout(tr.h);
  tr.innerHTML=st.trick.map(t=>card(t.card,'tk '+POS[(t.seat-me+4)%4]+(t.seat===st.win?' win':''))).join('');
  const tp=$('tpts');tp.hidden=st.last==null;if(st.last!=null)tp.textContent=st.last<0?'Cangou!':`Vaza de ${TEAM(st.last)}`;
  if(st.win!=null)tr.h=setTimeout(()=>tr.className='go-'+POS[(st.win-me+4)%4],1600);
  $('hand').innerHTML=st.hand.map(c=>card(c,st.canPlay?'ok':'')).join('');
  {const cs=[...$('hand').children],n=cs.length,av=$('hand').clientWidth-8,W=cs.length?cs[0].offsetWidth:66,ml=n>1?Math.min(6,(av-n*W)/(n-1)):0;cs.forEach((c,i)=>c.style.marginLeft=i?ml+'px':'0')}
  const vz=st.R.map(x=>x<0?'⚪':x===my?'🟢':'🔴').join(' ');
  let txt='',bar='';
  if(st.phase==='decide11'){
    if(!sp&&st.d11===my){txt=`Mão de ${st.onze}! Seu parceiro tem:`;bar=(st.partnerHand||[]).map(c=>card(c)).join('')+'<button data-a="d11:play">Jogar</button><button class="ghost" data-a="d11:run">Correr</button>'}
    else txt=`Mão de ${st.onze}: ${TEAM(st.d11)} estão decidindo…`;
  }else if(st.phase==='play'){
    const p=st.pending;
    if(p){txt=`${nm(p.by)} pediu ${p.name.toUpperCase()}! (vale ${p.value})`;
      if(!sp&&p.team===my)bar=`<button data-a="resp:yes">Aceitar</button><button class="ghost" data-a="resp:no">Correr</button>`+(p.raise?`<button class="red" data-a="resp:raise">${p.raise.toUpperCase()}!</button>`:'');
      else txt+=' Aguardando resposta…';}
    else{txt=(sp?'👀 Assistindo · ':'')+(st.turn===me&&!sp?'Sua vez!':`Vez de ${nm(st.turn)}`)+` · vale ${st.value}${st.ferro?' (mão de ferro)':''}`;
      if(st.canTruco)bar=`<button class="red" data-a="truco">${st.callName.toUpperCase()}!</button>`}
    if(vz)txt+='  '+vz;
  }
  $('status').textContent=txt;$('tbar').innerHTML=bar;
  const r=st.result,over=st.phase==='handEnd'||st.phase==='end';$('ov').hidden=!over;
  if(over&&r){
    $('ovt').textContent=st.phase==='end'?(st.score[my]>=12?(sp?`${NOS} venceu`:'🏆 Vocês venceram a partida!'):(sp?`${ELES} venceu`:'Eles venceram a partida'))+` (${st.matches[my]} × ${st.matches[1-my]})`
      :r.team<0?'Empatou tudo, ninguém pontua':(r.team===my&&!sp?`Vocês ganharam ${r.value}`:`${TEAM(r.team)} ganharam ${r.value}`);
    $('ovp').textContent=`Placar: ${NOS} ${st.score[my]} × ${st.score[1-my]} ${ELES}`;
    $('next').textContent=st.phase==='end'?'Nova partida':'Próxima mão';
  }
}
function renderGame(){
  const sp=st.me<0,me=sp?0:st.me,my=me%2,NOS=sp?'Dupla A':'Nós',ELES=sp?'Dupla B':'Eles';
  $('gnum').textContent=st.code+(st.specs.length?` · 👀${st.specs.length}`:'');
  $('sitbot').hidden=!(sp&&st.seats.some(s=>s&&s.bot));
  $('score').innerHTML=`<div class="cz">${NOS} ${cruz(st.games[my])}${cruz(st.games[1-my])} ${ELES}</div><small style="display:block;opacity:.75;text-align:center">Pontos <b style="font-size:15px">${st.pts[my]} × ${st.pts[1-my]}</b> · Partidas ${st.matches[my]} × ${st.matches[1-my]}${st.mult>1?` · <b style="color:#f4c542;font-size:13px">mão vale x${st.mult}</b>`:''}</small>`;
  $('trump').innerHTML=`<div><small>Trunfo<br>${esc(st.seats[st.dealer].name)}</small></div>`+card(st.trumpCard,'mini');
  for(let i=0;i<4;i++){
    const rel=(i-me+4)%4,el=$('p-'+POS[rel]),s=st.seats[i];
    el.className='pl '+POS[rel]+(sp&&!rel?' show':'')+(st.turn===i&&st.phase==='play'?' turn':'')+(i%2===my&&rel?' mate':'');
    el.innerHTML=`${s.bot?'🤖 ':''}${esc(s.name)}${s.online?'':' 💤'}<small>${st.counts[i]} cartas${!sp&&i%2===my?' · parceiro':''}</small>`;
  }
  const tr=$('trick');tr.className='';clearTimeout(tr.h);
  tr.innerHTML=st.trick.map(t=>card(t.card,'tk '+POS[(t.seat-me+4)%4]+(t.seat===st.win?' win':''))).join('');
  {const P={A:11,'7':10,K:4,J:3,Q:2},n=st.trick.reduce((a,t)=>a+(P[t.card[0]]||0),0),tp=$('tpts'); // valor da vaza
   tp.hidden=st.win==null;if(st.win!=null)tp.textContent=`+${n} para ${st.win%2===my?NOS:ELES}`}
  if(st.win!=null)tr.h=setTimeout(()=>tr.className='go-'+POS[(st.win-me+4)%4],1900); // deixa ver a vaza e depois leva para quem ganhou
  $('hand').innerHTML=st.hand.map(c=>card(c,st.legal.length?'ok':'')).join('');
  {const cs=[...$('hand').children],n=cs.length,av=$('hand').clientWidth-8,W=cs.length?cs[0].offsetWidth:66,ml=n>1?Math.min(6,(av-n*W)/(n-1)):0;cs.forEach((c,i)=>c.style.marginLeft=i?ml+'px':'0')}
  $('acc').hidden=!(st.canAccuse&&st.phase==='play');$('acc2').hidden=!(st.canAccuse&&st.phase==='handEnd');
  $('status').textContent=sp?'👀 Você está assistindo':st.phase!=='play'?'':st.turn===me?(st.legal.length?'Sua vez!':''):`Vez de ${st.seats[st.turn].name}`;
  const r=st.result,over=st.phase==='handEnd'||st.phase==='end';$('ov').hidden=!over;
  if(over&&r){
    const g=`${r.g} ponto${r.g>1?'s':''}`;
    $('ovt').textContent=st.phase==='end'?(Math.min(...st.games)===0?'🐱 Gato! ':'')+(sp?`${st.games[0]>=4?'Dupla A':'Dupla B'} venceu a partida`:st.games[my]>=4?'🏆 Vocês venceram a partida!':'Eles venceram a partida')+` (${st.matches[my]} × ${st.matches[1-my]})`:
      r.renuncia?`🚨 Renúncia de ${r.renuncia}!`:r.team<0?`Empate 60 × 60! Próxima mão vale x${st.mult}`:(r.band?'🚩 Bandeira! ':'')+(r.m>1?`Valendo x${r.m}! `:'')+(sp?`Dupla ${r.team?'B':'A'} ganhou ${g}`:r.team===my?`Vocês ganharam ${g}`:`Eles ganharam ${g}`);
    $('ovp').textContent=r.renuncia?`${r.acc} pegou. ${r.team===my?'Vocês ganham':'Eles ganham'} 4 jogos.`:r.falsa?`${r.falsa} acusou sem razão.`:`Pontos: ${NOS} ${r.pts[my]} × ${r.pts[1-my]} ${ELES}`;
    $('next').textContent=st.phase==='end'?'Nova partida':'Próxima mão';
  }
}
</script>
